<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice question · AI Employee 360</title>
    <style>
      :root {
        --bg: #f3f6fb;
        --surface: #ffffff;
        --border: #e2e8f0;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #2563eb;
        --danger: #dc2626;
        --danger-soft: #fef2f2;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      main {
        width: min(360px, calc(100vw - 32px));
        padding: 24px 20px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        text-align: center;
      }
      h1 { margin: 0 0 4px; font-size: 17px; }
      p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.45; }
      .mic {
        margin: 20px auto 12px;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        border: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      .mic.is-recording { background: var(--danger); box-shadow: 0 0 0 8px var(--danger-soft); }
      .mic:disabled { opacity: 0.5; cursor: default; }
      .mic:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
      #timer { font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; min-height: 20px; }
      #status.is-error { color: #991b1b; }
      .actions { margin-top: 14px; display: flex; gap: 8px; justify-content: center; }
      .link { border: 0; background: none; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; font-size: 13.5px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Speak your question</h1>
      <p id="status">Starting the microphone…</p>
      <button id="mic" class="mic" type="button" aria-label="Start recording">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3" />
          <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8.5 21h7" stroke-linecap="round" />
        </svg>
      </button>
      <div id="timer" aria-live="polite"></div>
      <div class="actions">
        <button id="cancel" class="link" type="button">Cancel</button>
      </div>
    </main>
    <script src="./voice-recorder.js"></script>
  </body>
</html>
